name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Builds the pages, then a minified copy in dist/ served from the Pages sub-path.
      # NOINDEX stays on until the site moves to patelcosmeticsurgeryclinic.com
      # (set the repository variable NOINDEX to 0 then, and BASE becomes '').
      - run: npm run dist
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          NOINDEX: ${{ vars.NOINDEX || '1' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
